name: release

# Every push to main is a release:
#   1. test   — full suite (tmux installed for the integration tests)
#   2. version — HEAD's vX.Y tag if it has one, else the next patch tag
#                (latest reachable vX.Y + 1), created and pushed here
#   3. build  — static linux amd64 + arm64 binaries (-X version.Version=<tag>)
#                and nfpm .debs (version X.Y)
#   4. release — GitHub Release <tag> with binaries, debs, checksums
#   5. apt    — signed apt repository on GitHub Pages
# Tags are always vXX.ZZZ (the repo's tag ruleset); git describe on a released
# commit is therefore exactly the release tag.

on:
  push:
    branches: [main]
  workflow_dispatch:
  pull_request:

# A reusable workflow cannot escalate beyond the permissions its caller holds,
# so the Pages permissions the apt job needs are granted here.
# Least privilege by default: only the publish job below raises this, and only
# for itself. The build jobs run Docker and clone third-party sources, so they
# should never hold a token that can write to Pages.
permissions:
  contents: read

# Serialise releases so two quick pushes never compute the same next tag.
concurrency:
  group: release-main
  cancel-in-progress: false

env:
  NFPM_VERSION: 2.41.1
  GO_MODULE: github.com/mithro/go-claude-teleport

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - run: sudo apt-get update && sudo apt-get install -y tmux
      - run: go vet ./...
      - run: go test -race ./...
      - name: packaging helper tests
        run: python3 -m unittest discover -s packaging -p 'version_test.py' -v

  version:
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: write   # push the release tag
    outputs:
      tag: ${{ steps.v.outputs.tag }}
      deb: ${{ steps.v.outputs.deb }}
      created: ${{ steps.v.outputs.created }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          fetch-tags: true
      - name: Decide the release tag
        id: v
        run: |
          set -euo pipefail
          TAG="$(python3 packaging/version.py tag)"
          DEB="$(python3 packaging/version.py deb "$TAG")"
          if python3 packaging/version.py is-tagged; then
            echo "HEAD already tagged $TAG"
            echo "created=false" >> "$GITHUB_OUTPUT"
          else
            git config user.name "github-actions[bot]"
            git config user.email "github-actions[bot]@users.noreply.github.com"
            git tag -a "$TAG" -m "Release $TAG"
            git push origin "refs/tags/$TAG"
            echo "created $TAG"
            echo "created=true" >> "$GITHUB_OUTPUT"
          fi
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "deb=$DEB" >> "$GITHUB_OUTPUT"
          echo "release tag: $TAG (deb $DEB)"

  build:
    needs: version
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          # `arch` is the Debian name (used by nfpm and in the .deb filename);
          # `goarch`/`goarm` are what the Go toolchain wants.
          - {arch: amd64, goarch: amd64, goarm: ""}
          - {arch: arm64, goarch: arm64, goarm: ""}
          - {arch: armhf, goarch: arm, goarm: "7"}
          - {arch: riscv64, goarch: riscv64, goarm: ""}
    env:
      TAG: ${{ needs.version.outputs.tag }}
      DEBVER: ${{ needs.version.outputs.deb }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: Build static binary
        run: |
          set -euo pipefail
          mkdir -p dist
          CGO_ENABLED=0 GOOS=linux GOARCH=${{ matrix.goarch }} \
          GOARM=${{ matrix.goarm }} \
            go build -trimpath \
              -ldflags "-s -w -X ${GO_MODULE}/internal/version.Version=${TAG}" \
              -o dist/claude-teleport ./cmd/claude-teleport
          ls -l dist/
      - name: Install nfpm
        run: |
          set -euo pipefail
          curl -fsSL -o /tmp/nfpm.deb \
            "https://github.com/goreleaser/nfpm/releases/download/v${NFPM_VERSION}/nfpm_${NFPM_VERSION}_amd64.deb"
          sudo dpkg -i /tmp/nfpm.deb
          nfpm --version
      - name: Build deb
        run: |
          set -euo pipefail
          VERSION="$DEBVER" ARCH="${{ matrix.arch }}" nfpm package -p deb -f nfpm.yaml -t dist/
          mv dist/claude-teleport "dist/claude-teleport-linux-${{ matrix.arch }}"
          ls -l dist/
          dpkg-deb -I dist/*_${{ matrix.arch }}.deb | head -20
          dpkg-deb -c dist/*_${{ matrix.arch }}.deb
      - uses: actions/upload-artifact@v4
        with:
          name: dist-${{ matrix.arch }}
          path: dist/

      # The static binary is suite-independent, so the same .deb is published
      # for every suite rather than rebuilt per suite.
      - uses: actions/upload-artifact@v4
        with:
          name: debs-trixie-${{ matrix.arch }}
          path: dist/*.deb
          if-no-files-found: error

      - uses: actions/upload-artifact@v4
        with:
          name: debs-sid-${{ matrix.arch }}
          path: dist/*.deb
          if-no-files-found: error

  release:
    needs: [version, build]
    runs-on: ubuntu-latest
    permissions:
      contents: write   # create the GitHub Release
    env:
      TAG: ${{ needs.version.outputs.tag }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          pattern: dist-*
          merge-multiple: true
          path: dist/
      - name: Checksums
        run: |
          set -euo pipefail
          cd dist
          sha256sum claude-teleport-linux-* *.deb > SHA256SUMS
          cat SHA256SUMS
      - name: Create or update the GitHub Release
        run: |
          set -euo pipefail
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" dist/* --clobber
          else
            gh release create "$TAG" dist/* \
              --title "$TAG" \
              --generate-notes \
              --notes "Static linux binaries (amd64, arm64), Debian packages and SHA256SUMS. Apt repository: https://mith.ro/go-claude-teleport/ (see index for setup)."
          fi

  apt:
    # Scoped to this job alone. A job calling a reusable workflow sets the
    # maximum permissions available to it, so the elevated Pages scopes stay
    # here rather than applying to the whole workflow.
    permissions:
      contents: read
      pages: write
      id-token: write
    # Build on PRs to validate, but never publish from one.
    if: github.event_name != 'pull_request'
    needs: build
    uses: mithro/apt-repo-action/.github/workflows/publish-apt.yml@main
    with:
      suites: "trixie sid"
      architectures: "amd64 arm64 armhf riscv64"
      origin: go-claude-teleport
      description: "Teleport Claude Code sessions between machines"
      keyring-name: go-claude-teleport.gpg
    secrets:
      gpg-private-key: ${{ secrets.APT_GPG_PRIVATE_KEY }}
