name: release

# Every push to main is a release:
#   1. test   — full suite (tmux installed for the integration tests)
#   2. version — HEAD's vX.Y tag if it has one, else the next patch tag
#                (latest reachable vX.Y + 1), created and pushed here
#   3. binaries — fat multi-arch claude-teleport (packaging/fatbuild.py):
#                one native per arch + the shared FATBLOB, so each carries all
#   4. debs   — one nfpm .deb per Debian arch, wrapping its canonical binary
#   5. release — GitHub Release <tag> with binaries, debs, checksums
#   6. apt    — signed apt repository on GitHub Pages
# Tags are always vXX.ZZZ (the repo's tag ruleset); git describe on a released
# commit is therefore exactly the release tag.

on:
  push:
    branches: [main]
  workflow_dispatch:
  # Deliberately NOT pull_request: the version job pushes a tag and the
  # release job cuts a GitHub Release, so running this on a PR publishes
  # a release from unmerged code.

# Least privilege by default: only the publish job below raises this, and only
# for itself. The build jobs run Docker and clone third-party sources, so they
# should never hold a token that can write to Pages.
permissions:
  contents: read

# Serialise releases so two quick pushes never compute the same next tag.
concurrency:
  group: release-main
  cancel-in-progress: false

env:
  NFPM_VERSION: 2.41.1
  GO_MODULE: github.com/mithro/go-claude-teleport

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - run: sudo apt-get update && sudo apt-get install -y tmux
      - run: go vet ./...
      - run: go test -race ./...
      - name: packaging helper tests
        run: python3 -m unittest discover -s packaging -p 'version_test.py' -v

  version:
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: write   # push the release tag
    outputs:
      tag: ${{ steps.v.outputs.tag }}
      deb: ${{ steps.v.outputs.deb }}
      created: ${{ steps.v.outputs.created }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          fetch-tags: true
      - name: Decide the release tag
        id: v
        run: |
          set -euo pipefail
          TAG="$(python3 packaging/version.py tag)"
          DEB="$(python3 packaging/version.py deb "$TAG")"
          if python3 packaging/version.py is-tagged; then
            echo "HEAD already tagged $TAG"
            echo "created=false" >> "$GITHUB_OUTPUT"
          else
            git config user.name "github-actions[bot]"
            git config user.email "github-actions[bot]@users.noreply.github.com"
            git tag -a "$TAG" -m "Release $TAG"
            git push origin "refs/tags/$TAG"
            echo "created $TAG"
            echo "created=true" >> "$GITHUB_OUTPUT"
          fi
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "deb=$DEB" >> "$GITHUB_OUTPUT"
          echo "release tag: $TAG (deb $DEB)"

  # One job builds every architecture's native claude-teleport and staples the
  # shared FATBLOB onto each (packaging/fatbuild.py), so every released
  # claude-teleport-linux-<arch> is a fat binary carrying all architectures and
  # can install the matching helper onto a different-arch remote with no
  # pre-install (the zero-install teleport path).
  binaries:
    needs: version
    runs-on: ubuntu-latest
    env:
      TAG: ${{ needs.version.outputs.tag }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: Build fat multi-arch binaries
        run: |
          set -euo pipefail
          python3 packaging/fatbuild.py --version "${TAG}"
          ls -l dist/
          # Sanity: the amd64 canonical must run and report the injected tag.
          test "$(./dist/claude-teleport-linux-amd64 version | awk '{print $2}')" = "${TAG}"
      - uses: actions/upload-artifact@v4
        with:
          name: dist-bin
          path: dist/claude-teleport-linux-*
          if-no-files-found: error

  # Package a .deb per Debian architecture from the matching fat canonical
  # binary. The binary carries every arch regardless; the .deb's Architecture
  # names the native ELF it wraps.
  debs:
    needs: [version, binaries]
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          # `arch` is the Debian name; `binarch` is the fatbuild.py arch id
          # whose canonical binary this .deb wraps.
          - {arch: amd64, binarch: amd64}
          - {arch: arm64, binarch: arm64}
          - {arch: armhf, binarch: arm}
          - {arch: riscv64, binarch: riscv64}
    env:
      DEBVER: ${{ needs.version.outputs.deb }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: dist-bin
          path: dist/
      - name: Install nfpm
        run: |
          set -euo pipefail
          curl -fsSL -o nfpm.deb \
            "https://github.com/goreleaser/nfpm/releases/download/v${NFPM_VERSION}/nfpm_${NFPM_VERSION}_amd64.deb"
          sudo dpkg -i nfpm.deb
          nfpm --version
      - name: Build deb
        run: |
          set -euo pipefail
          cp "dist/claude-teleport-linux-${{ matrix.binarch }}" dist/claude-teleport
          chmod +x dist/claude-teleport
          VERSION="$DEBVER" ARCH="${{ matrix.arch }}" nfpm package -p deb -f nfpm.yaml -t dist/
          rm -f dist/claude-teleport
          dpkg-deb -I dist/*_${{ matrix.arch }}.deb | head -20
          dpkg-deb -c dist/*_${{ matrix.arch }}.deb
      - uses: actions/upload-artifact@v4
        with:
          name: dist-deb-${{ matrix.arch }}
          path: dist/*.deb
          if-no-files-found: error

      # The static binary is suite-independent, so the same .deb is published
      # for every suite rather than rebuilt per suite.
      - uses: actions/upload-artifact@v4
        with:
          name: debs-trixie-${{ matrix.arch }}
          path: dist/*.deb
          if-no-files-found: error

      - uses: actions/upload-artifact@v4
        with:
          name: debs-sid-${{ matrix.arch }}
          path: dist/*.deb
          if-no-files-found: error

  release:
    needs: [version, binaries, debs]
    runs-on: ubuntu-latest
    permissions:
      contents: write   # create the GitHub Release
    env:
      TAG: ${{ needs.version.outputs.tag }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          pattern: dist-*
          merge-multiple: true
          path: dist/
      - name: Checksums
        run: |
          set -euo pipefail
          cd dist
          sha256sum claude-teleport-linux-* *.deb > SHA256SUMS
          cat SHA256SUMS
      - name: Create or update the GitHub Release
        run: |
          set -euo pipefail
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" dist/* --clobber
          else
            gh release create "$TAG" dist/* \
              --title "$TAG" \
              --generate-notes \
              --notes "Fat static linux binaries (386, amd64, armhf, arm64, riscv64 — each ~60 MB, carrying every arch so it can install itself onto a different-arch remote), Debian packages and SHA256SUMS. Apt repository: https://mith.ro/go-claude-teleport/ (see index for setup)."
          fi

  apt:
    # Scoped to this job alone. A job calling a reusable workflow sets the
    # maximum permissions available to it, so the elevated Pages scopes stay
    # here rather than applying to the whole workflow.
    permissions:
      contents: read
      pages: write
      id-token: write
    # Build on PRs to validate, but never publish from one.
    if: github.event_name != 'pull_request'
    needs: debs
    uses: mithro/apt-repo-action/.github/workflows/publish-apt.yml@main
    with:
      suites: "trixie sid"
      architectures: "amd64 arm64 armhf riscv64"
      origin: go-claude-teleport
      description: "Teleport Claude Code sessions between machines"
      keyring-name: go-claude-teleport.gpg
    secrets:
      gpg-private-key: ${{ secrets.APT_GPG_PRIVATE_KEY }}
