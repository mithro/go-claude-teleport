name: test
on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: "0 6 * * 1"   # Mondays 06:00 UTC: real-claude matrix

concurrency:
  # The event name is part of the key (C10): without it a push to main
  # cancels the weekly real-claude matrix running on the same ref, which
  # is the one run that exercises a real Claude at all.
  group: test-${{ github.workflow }}-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  unit:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - run: sudo apt-get update && sudo apt-get install -y tmux git
      - run: go vet ./...
      - name: gofmt
        run: test -z "$(gofmt -l .)" || { gofmt -l .; exit 1; }
      - run: go test -race ./...
      # ./internal/... , the same command the README documents (C11): the
      # tmuxlive tag is opt-in and only a handful of packages carry such
      # tests today, but naming two of them means a new one is silently
      # never run in CI.
      - run: go test -race -tags tmuxlive ./internal/...
      - name: packaging helper tests
        run: python3 -m unittest discover -s packaging -p 'version_test.py' -v

  integration:
    runs-on: ubuntu-latest
    needs: unit
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - run: test/integration/build.sh
      # -count=1: setup-go restores GOCACHE between runs, so without it a
      # re-run on an unchanged commit can report a cached `ok` and never
      # start a container at all.
      - run: go test -tags integration ./test/integration/ -v -count=1 -timeout 40m
      # The suite's TestMain tears down its containers on every path it
      # returns from — an ordinary test failure included — so this step
      # normally finds nothing (C9). It exists for the paths where TestMain
      # never returns: Go's own -timeout, which panics the test binary, and
      # a panic/abort in the harness itself. It does not fire on job-level
      # cancellation either, since a cancelled job skips if: failure()
      # steps entirely. Each run uses a dynamic compose project name
      # (ct25-<pid>-<nanos>, harness_test.go), so `docker compose logs`
      # can't address it by a fixed project/file — enumerate whatever is
      # left by container name prefix instead. The host-wide `name=ct25-`
      # filter assumes an ephemeral, single-job-at-a-time runner (true of
      # ubuntu-latest GitHub-hosted runners).
      - name: container logs on failure
        if: failure()
        run: |
          for c in $(docker ps -a --filter 'name=ct25-' -q); do
            echo "== $c"
            docker logs "$c" 2>&1 | tail -n 200
          done

  real-claude:
    if: github.event_name == 'schedule' || (github.event_name == 'push' && github.ref == 'refs/heads/main')
    runs-on: ubuntu-latest
    needs: unit
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        claude: ["2.1.247", "latest"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - run: test/integration/build.sh ${{ matrix.claude }}
      # -count=1 for the same reason as the integration job: a cached
      # `ok` would make the weekly real-Claude matrix a silent no-op.
      - run: CLAUDE_VERSION=${{ matrix.claude }} go test -tags 'integration realclaude' ./test/integration/ -run TestReal -v -count=1 -timeout 40m
      # See the integration job's equivalent step: TestMain already tears
      # down on every path it returns from, so this is for the -timeout
      # panic (and harness panics) only, and never for job-level
      # cancellation. Enumerates by container name prefix
      # since the run's compose project name is dynamic (ct25-<pid>-<nanos>);
      # the host-wide `name=ct25-` filter assumes an ephemeral,
      # single-job-at-a-time runner.
      - name: container logs on failure
        if: failure()
        run: |
          for c in $(docker ps -a --filter 'name=ct25-' -q); do
            echo "== $c"
            docker logs "$c" 2>&1 | tail -n 200
          done
