name: test
on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: "0 6 * * 1"   # Mondays 06:00 UTC: real-claude matrix

concurrency:
  group: test-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  unit:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - run: sudo apt-get update && sudo apt-get install -y tmux git
      - run: go vet ./...
      - name: gofmt
        run: test -z "$(gofmt -l .)" || { gofmt -l .; exit 1; }
      - run: go test -race ./...
      - run: go test -race -tags tmuxlive ./internal/tmuxx/ ./internal/orchestrate/
      - name: packaging helper tests
        run: python3 -m unittest discover -s packaging -p 'version_test.py' -v

  integration:
    runs-on: ubuntu-latest
    needs: unit
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - run: test/integration/build.sh
      - run: go test -tags integration ./test/integration/ -v -timeout 40m
      # The suite's TestMain tears down its containers on every path, so
      # this only ever finds anything when teardown itself failed (e.g. the
      # process was killed by the job timeout). Each run uses a dynamic
      # compose project name (ct25-<pid>-<nanos>, harness_test.go), so
      # `docker compose logs` can't address it by a fixed project/file —
      # enumerate whatever is left by container name prefix instead.
      - name: container logs on failure
        if: failure()
        run: |
          for c in $(docker ps -a --filter 'name=ct25-' -q); do
            echo "== $c"
            docker logs "$c" 2>&1 | tail -n 200
          done

  real-claude:
    if: github.event_name == 'schedule' || (github.event_name == 'push' && github.ref == 'refs/heads/main')
    runs-on: ubuntu-latest
    needs: unit
    timeout-minutes: 50
    strategy:
      fail-fast: false
      matrix:
        claude: ["2.1.247", "latest"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - run: test/integration/build.sh ${{ matrix.claude }}
      - run: CLAUDE_VERSION=${{ matrix.claude }} go test -tags 'integration realclaude' ./test/integration/ -run TestReal -v -timeout 40m
      # See the integration job's equivalent step: this only fires when the
      # suite's TestMain teardown itself failed, and enumerates by
      # container name prefix since the run's compose project name is
      # dynamic (ct25-<pid>-<nanos>).
      - name: container logs on failure
        if: failure()
        run: |
          for c in $(docker ps -a --filter 'name=ct25-' -q); do
            echo "== $c"
            docker logs "$c" 2>&1 | tail -n 200
          done
