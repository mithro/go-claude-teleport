name: test
on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: "0 6 * * 1"   # Mondays 06:00 UTC: real-claude matrix

concurrency:
  group: test-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  unit:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - run: sudo apt-get update && sudo apt-get install -y tmux git
      - run: go vet ./...
      - name: gofmt
        run: test -z "$(gofmt -l .)" || { gofmt -l .; exit 1; }
      - run: go test -race ./...
      - run: go test -race -tags tmuxlive ./internal/tmuxx/ ./internal/orchestrate/
      - name: packaging helper tests
        run: python3 -m unittest discover -s packaging -p 'version_test.py' -v

  integration:
    runs-on: ubuntu-latest
    needs: unit
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - run: test/integration/build.sh
      - run: go test -tags integration ./test/integration/ -v -timeout 40m
      # The suite's TestMain tears down its containers on every path, so
      # this only ever finds anything when the test step above itself
      # failed (a real test failure, or Go's own -timeout tripping) — not
      # on job-level cancellation, since a cancelled job skips if: failure()
      # steps entirely. Each run uses a dynamic compose project name
      # (ct25-<pid>-<nanos>, harness_test.go), so `docker compose logs`
      # can't address it by a fixed project/file — enumerate whatever is
      # left by container name prefix instead. The host-wide `name=ct25-`
      # filter assumes an ephemeral, single-job-at-a-time runner (true of
      # ubuntu-latest GitHub-hosted runners).
      - name: container logs on failure
        if: failure()
        run: |
          for c in $(docker ps -a --filter 'name=ct25-' -q); do
            echo "== $c"
            docker logs "$c" 2>&1 | tail -n 200
          done

  real-claude:
    if: github.event_name == 'schedule' || (github.event_name == 'push' && github.ref == 'refs/heads/main')
    runs-on: ubuntu-latest
    needs: unit
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        claude: ["2.1.247", "latest"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - run: test/integration/build.sh ${{ matrix.claude }}
      - run: CLAUDE_VERSION=${{ matrix.claude }} go test -tags 'integration realclaude' ./test/integration/ -run TestReal -v -timeout 40m
      # See the integration job's equivalent step: this only fires when the
      # test step above itself failed (including Go's own -timeout), not
      # on job-level cancellation. Enumerates by container name prefix
      # since the run's compose project name is dynamic (ct25-<pid>-<nanos>);
      # the host-wide `name=ct25-` filter assumes an ephemeral,
      # single-job-at-a-time runner.
      - name: container logs on failure
        if: failure()
        run: |
          for c in $(docker ps -a --filter 'name=ct25-' -q); do
            echo "== $c"
            docker logs "$c" 2>&1 | tail -n 200
          done
