# test/integration/docker-compose.yml
# Three hosts: source and jump on `public`; jump and dest on `private`.
# `dest` resolves only on `private`, so source must go --via jump.
x-common: &common
  build:
    context: .
    args:
      CLAUDE_VERSION: ${CLAUDE_VERSION:-}
  image: claude-teleport-it:${CLAUDE_VERSION:-fake}
  volumes:
    - ./keys:/run/keys:ro
    - ../../dist/claude-teleport:/usr/local/bin/claude-teleport:ro
  environment:
    # LC_ALL is for the TESTS' own `docker compose exec` tmux clients
    # (capture-pane/list-panes output they parse), not for the tool: the
    # tool's own `tmux -C` control client sets it for itself
    # (internal/tmuxx.utf8Env) and its ssh sessions deliberately get no
    # LC_ALL at all (entrypoint.sh), so a C-locale host is exercised.
    LC_ALL: C.UTF-8
    # No CLAUDE_CONFIG_DIR here: it must default to $HOME/.claude per-user
    # (alice vs bob) rather than being pinned to one user for the whole
    # container — docker exec inherits this from the container config
    # regardless of -u, so a hardcoded path here broke every bob@dest
    # scenario with a permission-denied (bob can't reach alice's $HOME).
    DISABLE_AUTOUPDATER: "1"
    DISABLE_TELEMETRY: "1"
    DISABLE_ERROR_REPORTING: "1"
    CLAUDE_CODE_DISABLE_NONESSENTIAL_TRAFFIC: "1"
    ANTHROPIC_BASE_URL: http://api:8080
    ANTHROPIC_API_KEY: dummy-key
  init: true

services:
  source:
    <<: *common
    hostname: source
    networks: [public]
    volumes:
      - ./keys:/run/keys:ro
      - ../../dist/claude-teleport:/usr/local/bin/claude-teleport:ro
      - ../../dist/fakeclaude:/usr/local/bin/claude:ro
  jump:
    <<: *common
    hostname: jump
    networks: [public, private]
  dest:
    <<: *common
    hostname: dest
    networks: [private]
    volumes:
      - ./keys:/run/keys:ro
      - ../../dist/claude-teleport:/usr/local/bin/claude-teleport:ro
      - ../../dist/fakeclaude:/usr/local/bin/claude:ro
  api:
    profiles: [realclaude]
    image: claude-teleport-fakeapi:local
    build:
      context: ../..
      dockerfile: test/integration/Dockerfile.fakeapi
    hostname: api
    networks: [public, private]
    command: ["/fakeapi-server", "-addr", ":8080", "-log", "/log"]
    volumes:
      - ./api-log:/log

networks:
  # Both networks are internal (C12): nothing in this harness needs runtime
  # internet — the images are prebuilt by build.sh, and real Claude Code
  # (layer 2) is pointed at the in-harness fakeapi by ANTHROPIC_BASE_URL.
  # Cutting the route makes that a property of the environment rather than
  # a promise: an accidental call to a real endpoint fails here instead of
  # succeeding quietly. "public" and "private" still differ in the way the
  # suite depends on — dest is only on "private", so source must go --via
  # jump to reach it.
  public:
    internal: true
  private:
    internal: true
